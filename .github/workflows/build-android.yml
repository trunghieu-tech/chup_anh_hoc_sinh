name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'csv-utils.js'
      - 'icon.svg'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LTV-Chup-Anh-Hoc-Sinh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTV-Student-Photo-APK
          path: LTV-Chup-Anh-Hoc-Sinh.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" LTV-Chup-Anh-Hoc-Sinh.apk --title "Ảnh học sinh LTV ${GITHUB_REF_NAME}" --generate-notes
